[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "refundguard-baseline"
version = "0.1.0"
description = "Headless dense policy retrieval and evaluation for RefundGuard AI"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.142.2",
  "fastembed==0.8.1",
  "langgraph==1.2.14",
  "langgraph-checkpoint-postgres==3.1.2",
  "numpy==2.5.3",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python==0.3.36"]
dev = [
    "httpx[socks]==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
refundguard = "refundguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/refundguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires TEST_DATABASE_URL for a disposable PostgreSQL + pgvector database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
