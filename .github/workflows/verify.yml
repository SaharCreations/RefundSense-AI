name: Verify demo
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-live-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci-disposable-only, POSTGRES_DB: refundguard_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d refundguard_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/refundguard_test
      ORT_DISABLE_TELEMETRY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with: {version: '0.12.19'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --locked --extra dev
      - run: .venv/bin/ruff check scripts/container_entrypoint.py scripts/local_secrets.py scripts/setup_demo.py scripts/verify_local_stack.py scripts/assert_test_report.py scripts/validate_infrastructure.py tests/test_container_entrypoint.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: .venv/bin/python scripts/download_model.py
      - run: .venv/bin/python scripts/verify_local_stack.py --with-retrieval --report-directory reports/ci_v1
      - run: .venv/bin/python scripts/assert_test_report.py reports/ci_v1/python-tests.xml --no-skips
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with: {name: native-sql-and-browser-evidence, path: reports/ci_v1, retention-days: 14}
  frontend-and-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {NEXT_TELEMETRY_DISABLED: '1'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build && npm run typecheck
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: python -m pip install cfn-lint==1.57.2 jsonschema==4.26.0 pyyaml==6.0.3 dockerfile-parse==2.0.1
      - run: cfn-lint infra/aws/stack.yaml && python scripts/validate_infrastructure.py
      - run: python scripts/local_secrets.py && docker compose config --quiet
      - run: docker build -f infra/docker/api.Dockerfile -t refundguard-api-ci .
      - run: docker build --target production -t refundguard-web-ci frontend
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with: {name: frontend-evidence, path: reports/frontend_latest, retention-days: 14}
